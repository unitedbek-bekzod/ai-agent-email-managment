<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Email Agent — Aqlli Pochta Boshqaruvi{% endblock %}</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome 6 Pro Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(99, 102, 241, 0.3) rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.7);
        }
        .glow-indigo {
            box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.3);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.96); }
        }
        .pulse-dot {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white antialiased">
    <!-- Top Navbar -->
    <header class="border-b border-slate-800/80 bg-[#0f172a]/80 backdrop-blur-xl sticky top-0 z-30 px-5 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-brain text-lg"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <a href="/" class="text-base font-extrabold bg-gradient-to-r from-white via-indigo-200 to-indigo-400 bg-clip-text text-transparent tracking-tight">
                        AI Email Agent
                    </a>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-semibold tracking-wide">PRO v2.0</span>
                </div>
                <p class="text-[10px] text-slate-400 font-medium hidden sm:block">Avtonom sun'iy intellekt pochta boshqaruvi</p>
            </div>
        </div>

        <!-- AI Semantic Search Bar -->
        <div class="flex-1 max-w-lg mx-6 hidden md:block">
            <div class="relative group">
                <i class="fa-solid fa-wand-magic-sparkles text-indigo-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs transition-colors group-focus-within:text-indigo-300"></i>
                <input 
                    type="text" 
                    id="nlSearchInput"
                    placeholder="Tabiiy tilda qidiring: 'Google xabarlari', 'shoshilinch', 'oxirgi hafta'..." 
                    class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl pl-9 pr-24 py-2 text-xs text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all shadow-inner"
                    onkeydown="if(event.key === 'Enter') handleNaturalSearch()"
                >
                <div class="absolute right-1.5 top-1/2 -translate-y-1/2 flex items-center gap-1">
                    <button 
                        onclick="handleNaturalSearch()" 
                        class="px-2.5 py-1 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-[11px] font-semibold rounded-lg text-white transition-all shadow-sm flex items-center gap-1"
                        title="Tabiiy til bo'yicha qidirish"
                    >
                        <span>AI Qidiruv</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Quick Actions -->
        <div class="flex items-center gap-2.5">
            <!-- Telegram Bot Pill -->
            <a 
                href="https://t.me/{{ settings.TELEGRAM_BOT_USERNAME or 'YourEmailAgentBot' }}" 
                target="_blank"
                class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-sky-500/10 border border-sky-500/25 text-sky-400 hover:bg-sky-500/20 text-xs font-semibold transition-all shadow-sm"
                title="Telegram Bot orqali boshqarish"
            >
                <i class="fa-brands fa-telegram text-sm text-sky-400"></i>
                <span class="hidden sm:inline">Telegram Bot</span>
            </a>

            <!-- Settings Link -->
            <a 
                href="/settings" 
                class="p-2 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800/80 border border-slate-800/60 transition-colors"
                title="Agent Sozlamalari & Xotirasi"
            >
                <i class="fa-solid fa-sliders text-sm"></i>
            </a>

            <!-- Sync Button -->
            <button 
                onclick="syncEmails()" 
                id="topSyncBtn"
                class="px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700/80 text-slate-300 hover:text-white border border-slate-700/80 text-xs font-medium transition-all flex items-center gap-1.5 shadow-sm"
                title="Pochtani yangilash / Sinxronlash"
            >
                <i class="fa-solid fa-arrows-rotate text-xs text-emerald-400" id="topSyncIcon"></i>
                <span class="hidden lg:inline text-[11px]">Sinxronlash</span>
            </button>
        </div>
    </header>

    <!-- Main Content View -->
    <main class="flex-1 flex overflow-hidden">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = {
                success: 'fa-circle-check text-emerald-400',
                error: 'fa-triangle-exclamation text-rose-400',
                info: 'fa-sparkles text-indigo-400'
            };
            toast.className = 'pointer-events-auto flex items-center gap-3 px-4 py-3 bg-slate-900/95 border border-slate-700/80 text-slate-100 rounded-xl shadow-2xl backdrop-blur-xl transform transition-all duration-300 translate-y-3 opacity-0 text-xs font-medium max-w-md';
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-sm shrink-0"></i> <span class="leading-relaxed">${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-3', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-3');
                setTimeout(() => toast.remove(), 350);
            }, 4000);
        }

        async function syncEmails() {
            const icon = document.getElementById('topSyncIcon');
            if (icon) icon.classList.add('fa-spin');
            showToast("Pochta serveri tekshirilmoqda...", "info");
            try {
                const res = await fetch('/api/accounts/sync', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    if (data.synced_count > 0) {
                        showToast(`Sinxronizatsiya muvaffaqiyatli! ${data.synced_count} ta yangi xabar AI tahlil qilindi.`, 'success');
                    } else {
                        showToast("Pochta tekshirildi. Barcha xatlar yangilangan holatda.", 'success');
                    }
                    if (typeof loadEmails === 'function') loadEmails();
                    if (typeof loadAccounts === 'function') loadAccounts();
                } else {
                    showToast('Sinxronlash xatosi: ' + (data.detail || "Noma'lum xatolik"), 'error');
                }
            } catch (err) {
                showToast('Server bilan bog\'lanishda xatolik', 'error');
            } finally {
                if (icon) icon.classList.remove('fa-spin');
            }
        }
    </script>
</body>
</html>
