[project]
name = "email-agent"
version = "0.1.0"
description = "AI Email Management Agent and Telegram Bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "greenlet>=3.1.1",
    "httpx>=0.28.0",
    "jinja2>=3.1.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.19",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
